id = "local-disk-write"
kind = "breaks"
title = "Files written to local disk"
kb = "files-and-uploads-with-cloud-storage"
part = "files"
subject = "the files on disk"
clean = "files written to disk"
why = "An instance's disk lives in its memory: a file counts against the memory limit, is gone when the instance stops, and other instances never see it, so an upload saved on one is a 404 on the next."
unless = '''(?i)\btmp|/tmp\b|tempfile|tempdir|temporary|mkdtemp|os\.TempDir|\btemp(?:\b|_)'''
include = ["**/*.py"]
# The group `dest` names the path a write goes to (see `unless` in the README). A copy into a file object the code
# opened itself (shutil.copyfileobj) is not here: the open() that made the object is.
regex = [
  '''\bopen\(\s*(?P<dest>[A-Za-z_][\w.]*)?[^)\n]*,\s*(?:mode\s*=\s*)?['"][wax]b?\+?['"]''',
  '''(?P<dest>[A-Za-z_][\w.]*)\.open\(\s*['"][wax]b?\+?['"]''',
  '''(?P<dest>[A-Za-z_][\w.]*)\.write_(?:text|bytes)\(''',
  '''\bshutil\.(?:copy|copy2|copyfile|copytree|move)\((?:\s*[^,\n]+,\s*(?P<dest>[A-Za-z_][\w.]*))?''',
  '''FileSystemStorage\b''',
]
fix = "Write to a Cloud Storage bucket (the google-cloud-storage package) and hand out signed URLs."
fixes = { Django = "Write to a Cloud Storage bucket (django-storages' Google Cloud backend for FileField) and hand out signed URLs." }
[task]
title = "Files to a Cloud Storage bucket"
detail = "Write to a bucket instead of the disk; for uploads, sign a PUT URL so the browser sends the file straight to the bucket and the service stores only the key. Copy the existing files over before the switch."
effort = "M"
phase = 2
