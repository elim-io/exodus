id = "queue-worker"
kind = "breaks"
title = "A worker waits on a Redis queue"
kb = "background-workers-with-cloud-tasks"
part = "worker"
subject = "the worker"
takes_over = "the queue goes to Cloud Tasks"
clean = "workers waiting on a queue"
include = ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/use[A-Z]*.?s", "**/*.d.ts"]  # the front-end folders and configs are places.toml's
# BullMQ's Worker takes a queue name and a processor (a thread's or a browser's Worker takes a path or URL and options);
# Bull and Bee-Queue process with .process([name,] [concurrency,] fn); amqplib consumes with .consume().
regex = [
  '''new\s+Worker\(\s*(?:['"`][^'"`\n]+['"`]|[A-Z][A-Z0-9_]*|\w*[Qq]ueue\w*)\s*,\s*[^{\s]''',
  '''(?:\w|\)|^[ \t]*)\.process\(\s*(?:['"]\w|\d|async\b|function\b|\(|[A-Za-z_$][\w$.]*\s*,)''',
  '''\b(?:channel|ch)\.consume\(''',
]
why = "Cloud Run gives an instance CPU only while it answers a request, so a worker waiting on a queue gets no CPU between requests and its jobs stall. With CPU always allocated it runs, and bills every second whether there is work or not."
fix = "Cloud Tasks: where the code adds a job, it creates a task that POSTs to /tasks/<name> on the service, and a handler there does the job and answers 2xx. Retries, backoff and rate limits move to the queue; check the OIDC token and make the handler safe to run twice."

[task]
title = "Worker: queue jobs to a Cloud Tasks handler"
detail = "Replace each queue.add() with a Cloud Tasks task that POSTs to /tasks/<name>, move the processor into that route, check the OIDC token, then drop the worker process and its Redis."
effort = "L"
phase = 2
