id = "background-thread"
kind = "breaks"
title = "Background threads"
kb = "background-workers-with-cloud-tasks"
part = "web"
subject = "the background threads"
clean = "background threads"
why = "A thread that works outside a request gets no CPU once the response is out, and it dies with the instance when traffic falls, so its work stalls or is lost."
include = ["**/*.rb", "**/*.rake", "**/Rakefile"]
regex = [
  '''\bThread\.new\b''',
  '''Concurrent::TimerTask''',
  '''queue_adapter\s*=\s*:async\b''',
]
fix = "Do the work inside the request, or hand it to Cloud Tasks; a loop that must always run goes to a Cloud Run worker pool."
fixes = { Rails = "Do the work inside the request, or hand it to Cloud Tasks through Active Job; a loop that must always run goes to a Cloud Run worker pool." }
[task]
title = "Background threads to Cloud Tasks or the request"
detail = "Run short work inside the request; send longer work to Cloud Tasks; a loop that must always run goes to a worker pool."
effort = "M"
phase = 2
