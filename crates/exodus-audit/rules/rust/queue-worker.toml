id = "queue-worker"
kind = "breaks"
title = "A worker waits on a queue"
kb = "background-workers-with-cloud-tasks"
part = "worker"
subject = "the worker"
takes_over = "the queue goes to Cloud Tasks"
clean = "workers waiting on a queue"
include = ["**/*.rs"]
stop_at = "#[cfg(test)]"
# apalis builds a worker on a storage (Redis, Postgres, AMQP); a blocking pop on a Redis list (the redis crate's
# BRPOP/BLPOP/BLMOVE command or method, fred's .brpop/.blpop); a Faktory consumer; a RabbitMQ consumer
# (lapin's basic_consume).
regex = [
  '''\bWorkerBuilder::new\(''',
  '''\bcmd\(\s*"(?:BRPOP|BLPOP|BLMOVE|BRPOPLPUSH|BZPOPMIN)"\s*\)''',
  '''\.(?:brpop|blpop|blmove|brpoplpush)\s*(?:::<[^>]*>)?\(''',
  '''\bfaktory::(?:Worker|Consumer)Builder\b''',
  '''\.basic_consume\(''',
]
why = "Cloud Run gives an instance CPU only while it answers a request, so a worker waiting on a queue gets no CPU between requests and its jobs stall. With CPU always allocated it runs, and bills every second whether there is work or not."
fix = "Cloud Tasks: where the code adds a job, it creates a task that POSTs to /tasks/<name> on the service, and a handler there (an axum or actix route) does the job and answers 2xx. Retries, backoff and rate limits move to the queue; check the OIDC token and make the handler safe to run twice."

[task]
title = "Worker: queue jobs to a Cloud Tasks handler"
detail = "Replace each enqueue with a Cloud Tasks task that POSTs to /tasks/<name>, move the job's code into that route, check the OIDC token, then drop the worker process and its Redis."
effort = "L"
phase = 2
