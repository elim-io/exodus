id = "in-process-timer"
kind = "breaks"
title = "Timers inside the process"
kb = "cron-and-timers-with-cloud-scheduler"
part = "cron"
subject = "the timers"
clean = "in-process timers"
why = "A service at zero has no process to run a timer, a running one gets no CPU between requests, and with several instances the timer fires once per instance: late, never, or twice."
include = ["**/*.rs"]
stop_at = "#[cfg(test)]"
# job_scheduler_ng and tokio-cron-scheduler (JobScheduler), clokwerk, and a tokio interval driving a loop. An interval
# that keeps a WebSocket or a stream alive is a heartbeat inside one connection, not a schedule.
unless = '''(?i)timeout|heartbeat|keep.?alive|ping'''
unless_in = '''(?i)\bws\b|websocket|Stream!|EventStream|heartbeat|keep.?alive'''
regex = [
  '''\bJobScheduler::new\(''',
  '''\bclokwerk::(?:Async)?Scheduler::new\(''',
  '''\b(?:tokio::)?time::interval\(''',
]
fix = "Cloud Scheduler on the same cron lines: short work calls POST /cron/<name> on the service with an OIDC token, long work starts a Cloud Run job. Set each job's time zone; the timer ran on the server's, usually UTC."
[task]
title = "Timers to Cloud Scheduler"
detail = "Give each schedule an endpoint (POST /cron/<name>, OIDC token checked) or a Cloud Run job, create a Cloud Scheduler job per schedule with its time zone, then stop starting the scheduler when the app runs on Cloud Run."
effort = "M"
phase = 2
