id = "long-lived-connection"
kind = "idle"
title = "Long-lived connections"
kb = "patterns-that-break-on-cloud-run"
part = "web"
subject = "the open connections"
clean = "long-lived connections"
why = "Cloud Run supports WebSockets and server-sent events, but a request lasts at most 60 minutes, so clients must reconnect; an open connection keeps its instance billed the whole time, and messages between users on different instances need a shared store or pub/sub."
fix = "For a few connections, keep them and let clients reconnect. For thousands open all day, a managed realtime service, or staying on an always-on host, usually costs less."
include = ["**/*.rs"]
stop_at = "#[cfg(test)]"
regex = [
  '''\brocket_ws::(?:WebSocket|Stream!|Channel)''',
  '''\bWebSocketUpgrade\b''',
  '''\btokio_tungstenite::accept_(?:async|hdr_async)\(''',
  '''\b(?:axum::response::sse::)?Sse::new\(''',
  '''\bEventStream!\s*\{''',
  '''\bactix_web_actors::ws::start\(''',
]
[task]
title = "Connections: reconnect and share messages across instances"
detail = "Set the request timeout to 60 minutes, make the client reconnect, and pass messages between instances through Pub/Sub or the database."
effort = "M"
phase = 2
