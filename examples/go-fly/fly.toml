app = "preview-cards"
primary_region = "ams"

[build]

[env]
  DB_PATH = "/data/cards.db"

[mounts]
  source = "cards_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
